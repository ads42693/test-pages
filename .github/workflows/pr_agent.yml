name: PR-Agent Auto Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, "review_requested"]

jobs:
  pr_review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Probar conexión Ollama
        run: |
          curl -X POST "${{ secrets.OLLAMA_API_BASE }}/api/generate" \
          -H "Content-Type: application/json" \
          -d '{"model": "codellama:7b", "prompt": "Hola GitHub Actions!"}'
          
      - name: Run PR-Agent
        uses: qodo-ai/pr-agent@main
        env:
          OLLAMA_API_BASE: "https://tunel-ngrok.ngrok-free.app"  # Tu URL pública
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG_FILE: "pr_agent.toml"
          LITELLM_MODEL: "ollama/codellama:7b"
          PR_AGENT_DISABLE_OPENAI: "true"  # Variable mágica