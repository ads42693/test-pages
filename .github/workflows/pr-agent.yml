name: Revisión IA Completa

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      # Paso 1: Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Paso 2: Obtener diferencias
      - name: Get PR Diff
        id: get-diff
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          git diff $BASE_SHA $HEAD_SHA > diff.txt
          echo "DIFF=$(base64 -w0 diff.txt)" >> $GITHUB_OUTPUT

      # Paso 3: Ejecutar PR Agent y capturar feedback
      - name: Run AI Review
        id: ai-review
        uses: Codium-ai/pr-agent@main
        env:
          OLLAMA_URL: "https://87a3-179-6-169-49.ngrok-free.app"  # URL de tu túnel ngrok
          PR_AGENT_MODEL: "ollama/codellama:13b"                  # Modelo en español
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_TIMEOUT: "300"                                       # Tiempo extra para modelos grandes
          DIFF: ${{ steps.get-diff.outputs.DIFF }}
        with:
          mode: "review"
        # Se asume que esta acción exporta la salida en "feedback"
      
      # Paso 4: Filtrar el feedback recibido, eliminando líneas de log innecesarias
      - name: Filter Feedback
        id: filter-feedback
        run: |
          FEEDBACK="${{ steps.ai-review.outputs.feedback }}"
          echo "Feedback original:"
          echo "$FEEDBACK"
          # Se filtran mensajes que no aporten al feedback, como logs de sincronización o configuración
          FILTERED=$(echo "$FEEDBACK" | grep -v -E "Consider adding comments|Skipping action:|Applying repo settings|enable_custom_labels:" || true)
          echo "Filtered feedback:"
          echo "$FILTERED"
          echo "FILTERED_FEEDBACK=$FILTERED" >> $GITHUB_OUTPUT

      # Paso 5: Publicar comentario filtrado solo si hay contenido útil
      - name: Post Filtered Comment
        if: steps.filter-feedback.outputs.FILTERED_FEEDBACK != ''
        uses: actions/github-script@v6
        with:
          script: |
            const feedback = "${{ steps.filter-feedback.outputs.FILTERED_FEEDBACK }}";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `**Revisión IA (Filtrada):**\n\n${feedback}`
            });
