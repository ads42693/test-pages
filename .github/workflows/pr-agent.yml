name: PR-Agent Auto Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  pr_review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Permite postear comentarios
      issues: write         # Opcional para crear issues

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para análisis completo del diff

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install PR-Agent
        run: pip install "pr-agent[ollama]==0.2.4"

      - name: Run Code Review
        env:
          OLLAMA_API_BASE: ${{ secrets.OLLAMA_API_BASE }}
          OLLAMA_MODEL: "codellama:7b"
        run: |
          pr-agent review \
            --config-file .pr_agent.toml \
            --git-provider github \
            --pr_id ${{ github.event.pull_request.number }} \
            --max_cost 0  # Desactiva límites económicos