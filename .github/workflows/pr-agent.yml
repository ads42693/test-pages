name: Code Review using Local Model

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  code-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff
        id: get-diff
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          git diff $BASE_SHA $HEAD_SHA > diff.txt
          # Puedes imprimir el diff para debug (opcional)
          echo "Diff generado:"
          cat diff.txt

      - name: Send diff to Local Model via ngrok
        id: run-local-model
        run: |
          # Envía el diff codificado en base64 a tu endpoint de revisión.
          RESPONSE=$(curl -s -X POST "https://87a3-179-6-169-49.ngrok-free.app/review" \
            -H "Content-Type: application/json" \
            -d "{\"diff\": \"$(cat diff.txt | base64 -w0)\"}")
          echo "Respuesta del modelo: $RESPONSE"
          echo "::set-output name=review_response::$RESPONSE"

      - name: Post Code Review Comment
        uses: actions/github-script@v6
        with:
          script: |
            const reviewResponse = "${{ steps.run-local-model.outputs.review_response }}";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `**Revisión de Código (Agente Local):**\n\n${reviewResponse}`
            });
