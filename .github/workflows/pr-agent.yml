name: Revisión IA Completa

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      # Paso 1: Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Paso 2: Obtener diferencias
      - name: Get PR Diff
        id: get-diff
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          git diff $BASE_SHA $HEAD_SHA > diff.txt
          echo "DIFF=$(base64 -w0 diff.txt)" >> $GITHUB_OUTPUT

      # Paso 3: Ejecutar PR Agent (¡Este paso ya publica el comentario automáticamente!)
      - name: Run AI Review
        uses: Codium-ai/pr-agent@main
        env:
          OLLAMA_URL: "https://87a3-179-6-169-49.ngrok-free.app"  # URL de tu túnel ngrok
          PR_AGENT_MODEL: "ollama/codellama:13b"  # Modelo en español
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_TIMEOUT: "300"  # Tiempo extra para modelos grandes
        with:
          mode: "review"  # Modo de revisión automática
