name: Revisión Automática IA

on:
  pull_request:
    types: [opened, synchronize]  # Se activa al crear/actualizar PR

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write  # Permiso para comentar
      contents: read

    steps:
      # Paso 1: Checkout del código con histórico completo
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para los diffs

      # Paso 2: Ejecutar PR Agent con modelo local
      - name: Run AI Review
        uses: Codium-ai/pr-agent@main
        env:
          OLLAMA_URL: "https://87a3-179-6-169-49.ngrok-free.app"  # URL de tu túnel ngrok
          PR_AGENT_MODEL: "ollama/codellama:13b"  # Modelo en español
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_TIMEOUT: "300"  # Tiempo extra para modelos grandes
        with:
          mode: "review"  # Modo de revisión automática