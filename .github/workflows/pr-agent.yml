name: Trigger PR-Agent Command

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  trigger-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    env:
      # Variables de entorno para referencia (no se inyectan en el comando)
      OPENAI_KEY: ""  # No se usa para modelos locales
      OLLAMA_URL: "https://87a3-179-6-169-49.ngrok-free.app"
      PR_AGENT_MODEL: "ollama/codellama:13b"
    steps:
      - name: Post review command comment
        uses: actions/github-script@v6
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "@CodiumAI-Agent /review --model=ollama/codellama:13b --ollama_url=https://87a3-179-6-169-49.ngrok-free.app"
            });
