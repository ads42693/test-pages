
name: Custom Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, "review_requested"]

permissions:
  contents: read
  pull-requests: write  # Permiso explícito requerido

jobs:
  code_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}  # Obtener commit correcto

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Get PR Diff
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt

      - name: Generate review with Ollama
        id: analyze
        env:
          OLLAMA_ENDPOINT: ${{ secrets.OLLAMA_API_BASE }}/api/generate
        run: |
          # Sanitizar diff para JSON
          DIFF_CONTENT=$(sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' -e 's/$/\\n/' pr_diff.txt | tr -d '\n')
          
          RESPONSE=$(curl -f -s -X POST "$OLLAMA_ENDPOINT" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "model": "codellama:7b",
            "prompt": "Revisar código. Formato markdown:\\n$(echo "$DIFF_CONTENT" | head -c 10000)",
            "stream": false,
            "options": {"temperature": 0.2}
          }
          EOF
          ) || echo "Ollama_error=true" >> $GITHUB_ENV
          
          if [ -z "$RESPONSE" ]; then
            echo "suggestions=Error generando revisión" >> $GITHUB_ENV
          else
            SUGGESTIONS=$(echo "$RESPONSE" | jq -r '.response' | sed 's/"/\\"/g; s/\$/\$\$/g')
            echo "suggestions=$SUGGESTIONS" >> $GITHUB_ENV
          fi

      - name: Post review as comment
        if: env.suggestions != '' && !contains(env.suggestions, 'Ollama_error')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JSON_PAYLOAD=$(jq -n \
            --arg body "🔍 **Revisión Automática**\n\n${{ env.suggestions }}\n\n_Generado por modelo local_" \
            '{"body": $body}')
          
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d "$JSON_PAYLOAD"