
name: Custom Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, "review_requested"]

permissions:
  contents: read
  pull-requests: write

jobs:
  code_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Get PR Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt

      - name: Test Ollama connection
        env:
          OLLAMA_ENDPOINT: ${{ secrets.OLLAMA_API_BASE }}/api/tags
        run: |
          curl -s "$OLLAMA_ENDPOINT" | jq .models[].name

      - name: Generate review with Ollama
        id: analyze
        env:
          OLLAMA_ENDPOINT: ${{ secrets.OLLAMA_API_BASE }}/api/generate
        run: |
          DIFF_CONTENT=$(cat pr_diff.txt | sed 's/\\/\\\\/g; s/"/\\"/g; s/\$/\$\$/g')
          
          RESPONSE=$(curl -s -X POST "$OLLAMA_ENDPOINT" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "model": "codellama:7b",
            "prompt": "Revisa este código:\\n$DIFF_CONTENT\\n\\nSugerencias en markdown:",
            "stream": false,
            "options": {"temperature": 0.2}
          }
          EOF
          ) || echo "Ollama_error=true" >> $GITHUB_ENV
          
          if [ $(echo "$RESPONSE" | jq 'has("response")') == "true" ]; then
            SUGGESTIONS=$(echo "$RESPONSE" | jq -r '.response')
            echo "suggestions=$SUGGESTIONS" >> $GITHUB_ENV
          else
            echo "suggestions=🚨 Error en la respuesta del modelo. Verificar: \n1. Modelo instalado\n2. Conexión con Ollama\n3. Tamaño del diff" >> $GITHUB_ENV
          fi

      - name: Post review as comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENT=$(echo -e "${{ env.suggestions }}")
          
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d "$(jq -n --arg body "$COMMENT" '{"body":$body}')"