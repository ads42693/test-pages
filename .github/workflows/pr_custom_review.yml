name: AI Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  code_review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Generate PR Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }} --unified=0 > pr_diff.txt
          echo "Diff lines: $(wc -l pr_diff.txt)"

      - name: Analyze with Ollama
        id: code_analysis
        env:
          OLLAMA_API: ${{ secrets.OLLAMA_API_BASE }}
        run: |
          # 1. Limpiar diff sin usar sed
          DIFF_CONTENT=$(cat pr_diff.txt | 
            perl -pe 's/\e\[[0-9;]*[a-zA-Z]//g' |  # Eliminar códigos ANSI
            jq -Rs . |                            # Escapar como raw string JSON
            sed 's/^"//;s/"$//')                   # Remover comillas extras
          
          # 2. Limitar tamaño conservando estructura
          TRUNC_DIFF=${DIFF_CONTENT:0:3000}
          
          # 3. Construir payload con jq
          JSON_PAYLOAD=$(jq -n \
            --arg model "codellama:7b" \
            --arg diff "$TRUNC_DIFF" \
            '{
              model: $model,
              prompt: "Analizar este diff y dar 3 recomendaciones en markdown:\n\($diff)",
              stream: false,
              options: {temperature: 0.2}
            }' | jq -c)
          
          echo "Payload size: ${#JSON_PAYLOAD} chars"

          # 4. Enviar petición con verificación HTTP
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" \
            -X POST "$OLLAMA_API/api/generate" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD")
          
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::API Error. HTTP Code: $HTTP_CODE"
            cat response.json
            exit 1
          fi

          # 5. Procesar respuesta
          SUGGESTIONS=$(jq -r '.response // empty' response.json |
            sed -e 's/\\"/"/g' -e 's/\\n/\n/g')
          
          if [ -n "$SUGGESTIONS" ]; then
            echo "suggestions<<EOF" >> $GITHUB_ENV
            echo "$SUGGESTIONS" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "::warning::Respuesta vacía de Ollama"
            echo "suggestions=" >> $GITHUB_ENV
          fi

      - name: Post Review Comment
        if: env.suggestions != ''
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## 📝 Análisis Automático\n\n${process.env.suggestions}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });