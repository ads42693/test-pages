name: AI Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  code_review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Generate PR Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }} -- . > pr_diff.txt
          echo "Generated diff:"
          cat pr_diff.txt | head -n 50

      - name: Analyze with Ollama
        id: code_analysis
        env:
          OLLAMA_API: ${{ secrets.OLLAMA_API_BASE }}
        run: |
          # Sanitizar y limitar diff
          DIFF_CONTENT=$(sed -e 's/\x1B\[[0-9;]*[JKmsu]//g' -e 's/\\/\\\\/g' -e 's/"/\\"/g' pr_diff.txt | head -n 100 | jq -Rs .)
          
          # Construir payload con timeout
          JSON_PAYLOAD=$(jq -n \
            --arg model "codellama:7b" \
            --arg diff "$DIFF_CONTENT" \
            '{
              "model": $model,
              "prompt": "Revisa este diff y genera 3 recomendaciones en markdown:\n\($diff)",
              "stream": false,
              "options": {"temperature": 0.2}
            }')

          echo "Request payload: $JSON_PAYLOAD"
          
          # Enviar solicitud con verificación de errores
          RESPONSE=$(curl -sS -m 120 -X POST "$OLLAMA_API/api/generate" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD" || echo '{"error": "curl_failed"}')

          echo "Raw API response: $RESPONSE"
          
          # Procesamiento robusto
          if ! SUGGESTIONS=$(echo "$RESPONSE" | jq -r '.response // "null"'); then
            echo "::error::Invalid JSON response"
            SUGGESTIONS="null"
          fi

          echo "suggestions=${SUGGESTIONS}" >> $GITHUB_ENV

      - name: Post Review Comment
        if: env.suggestions != 'null' && env.suggestions != ''
        uses: actions/github-script@v7
        with:
          script: |
            const body = `
              ## 🛠️ Análisis Automático
              ${process.env.suggestions}
              
              _Generado con [codellama-7b](${process.env.OLLAMA_API})_
            `;
            
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } catch (error) {
              core.error("Error al publicar: " + error.message);
              core.setFailed("Falló publicación de comentario");
            }