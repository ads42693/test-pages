
name: Custom Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, "review_requested", "synchronize"]

permissions:
  pull-requests: write  # Permiso mínimo necesario
  contents: write
  issues: write

jobs:
  code_review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get install -y jq

      - name: Get PR Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt

      - name: Generate Review
        id: ollama
        env:
          OLLAMA_API: ${{ secrets.OLLAMA_API_BASE }}
        run: |
          # Limpiar y preparar el diff (conservar formato)
          DIFF=$(head -n 100 pr_diff.txt | sed -e 's/\x1B\[[0-9;]*[JKmsu]//g' | jq -Rs .)
          
          # Construir payload
          JSON_PAYLOAD=$(jq -n \
            --arg model "codellama:7b" \
            --arg diff "$DIFF" \
            '{
              "model": $model,
              "prompt": "Generar 3 sugerencias en formato markdown (## Sugerencias\\n1. Item\\n2. Item):\n\($diff)",
              "stream": false,
              "options": {"temperature": 0.2}
            }')

          # Obtener respuesta
          RESPONSE=$(curl -s -X POST "$OLLAMA_API/api/generate" -H "Content-Type: application/json" -d "$JSON_PAYLOAD")
          echo "API Response: $RESPONSE"
          
          # Extraer y formatear sugerencias
          SUGGESTIONS=$(echo "$RESPONSE" | jq -r '.response' | 
            sed -e 's/\\"/"/g' -e 's/"/\\"/g' -e 's/\n/\\n/g')

          # Guardar en environment variable (formato seguro)
          echo "suggestions<<EOF" >> $GITHUB_ENV
          echo -e "$SUGGESTIONS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Post Comment
        if: env.suggestions != ''
        uses: actions/github-script@v7
        with:
          script: |
            const body = `
              ## 🤖 Revisión Automática 
              
              ${process.env.suggestions 
                ? process.env.suggestions
                    .replace(/\\n/g, '\n')  # Restaurar saltos de línea
                    .replace(/\\"/g, '"')    # Remover escapes de comillas
                : 'No se generaron sugerencias'}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });