name: AI Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  code_review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Generate PR Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }} -- . > pr_diff.txt
          echo "Generated diff:"
          cat pr_diff.txt | head -n 50

      - name: Analyze with Ollama
        id: code_analysis
        env:
          OLLAMA_API: ${{ secrets.OLLAMA_API_BASE }}
        run: |
          # 1. Limpiar y formatear diff correctamente
          DIFF_CONTENT=$(sed -e 's/\x1B\[[0-9;]*[JKmsu]//g' -e 's/\\/\\\\/g' -e 's/"/\\"/g' pr_diff.txt | head -n 100)
          
          # 2. Construir JSON válido con jq
          JSON_PAYLOAD=$(jq -n \
            --arg model "codellama:7b" \
            --arg diff "$DIFF_CONTENT" \
            '{
              "model": $model,
              "prompt": "Revisa este diff y genera 3 recomendaciones en markdown:\n\($diff)",
              "stream": false,
              "options": {"temperature": 0.2}
            }' | jq -c .)  # Compactar JSON

          echo "Request payload:"
          echo "$JSON_PAYLOAD"
          
          # 3. Validar JSON antes de enviar
          if ! jq -e . <<< "$JSON_PAYLOAD" >/dev/null; then
            echo "::error::JSON inválido generado"
            exit 1
          fi

          # 4. Enviar petición con manejo de errores
          RESPONSE=$(curl -sS -X POST "$OLLAMA_API/api/generate" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD" || echo '{"error": "curl_failed"}')

          echo "Raw API response: $RESPONSE"
          
          # 5. Procesar respuesta
          SUGGESTIONS=$(echo "$RESPONSE" | jq -r '.response // empty' | sed -e 's/\\"/"/g' -e 's/\n/ /g')
          
          if [ -n "$SUGGESTIONS" ]; then
            echo "suggestions<<EOF" >> $GITHUB_ENV
            echo "$SUGGESTIONS" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "::warning::No se recibieron sugerencias"
            echo "suggestions=" >> $GITHUB_ENV
          fi

      - name: Post Review Comment
        if: env.suggestions != 'null' && env.suggestions != ''
        uses: actions/github-script@v7
        with:
          script: |
            const body = `
              ## 🛠️ Análisis Automático
              ${process.env.suggestions}
              
              _Generado con [codellama-7b](${process.env.OLLAMA_API})_
            `;
            
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } catch (error) {
              core.error("Error al publicar: " + error.message);
              core.setFailed("Falló publicación de comentario");
            }