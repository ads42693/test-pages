
name: Custom Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, "review_requested"]

permissions:
  pull-requests: write  # Permiso mínimo necesario

jobs:
  code_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para el diff completo

      - name: Setup dependencies
        run: sudo apt-get install -y jq  # Para procesar JSON

      - name: Get PR Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff --unified=20 origin/${{ github.base_ref }}...HEAD > pr_diff.txt

      - name: Generate security review
        id: ollama_review
        env:
          OLLAMA_URL: ${{ secrets.OLLAMA_ENDPOINT }}
        run: |
          # Configurar shell para manejo estricto de errores
          set -euo pipefail
          
          # 1. Verificar existencia del diff
          if [ ! -f pr_diff.txt ] || [ ! -s pr_diff.txt ]; then
            echo "❌ Error: pr_diff.txt no existe o está vacío"
            exit 1
          fi
      
          # 2. Sanitizar y limitar diff (método robusto)
          SANITIZED_DIFF=$(head -c 15000 pr_diff.txt | LC_ALL=C sed -e 's/[^[:alnum:] áéíóúÁÉÍÓÚñÑ_#@¿?¡!]/ /g' -e 's/\\/ /g')
      
          # 3. Construir prompt con encoding explícito
          PROMPT=$(cat <<-EOF | iconv -t ASCII//TRANSLIT
          Revisión de código - Requisitos:
          1. Priorizar seguridad (OWASP Top 10)
          2. Verificar formato PEP8
          3. Aplicar principios SOLID
      
          Código a analizar:
          ${SANITIZED_DIFF}
      
          Formato requerido:
          - Usar guiones para listas
          - Código entre backticks
          - Máximo 3 sugerencias
          EOF
          )
      
          # 4. Llamar a Ollama con timeout
          RESPONSE=$(timeout 120 curl -s -X POST "$OLLAMA_URL/api/generate" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"codellama:7b\",\"prompt\":\"$PROMPT\",\"stream\":false}") || {
              echo "⏰ Timeout en conexión con Ollama"
              exit 0  # No fallar el workflow completo
            }
      
          # 5. Validar respuesta
          if ! SUGGESTIONS=$(echo "$RESPONSE" | jq -r '.response' | sed 's/[“”‘’]/"/g'); then
            echo "::warning::Error procesando respuesta JSON"
            echo "suggestions=🚨 Error técnico. Revisar logs" >> $GITHUB_ENV
            exit 0
          fi
      
          # 6. Limitar longitud del comentario
          TRUNCATED_SUGGESTIONS=$(echo "$SUGGESTIONS" | head -c 4000)
          echo "suggestions=$TRUNCATED_SUGGESTIONS" >> $GITHUB_ENV

      - name: Post review comment
        if: env.suggestions != ''
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d "{\"body\":\"🔍 **Revisión Automática**\n\n${{ env.suggestions }}\"}"