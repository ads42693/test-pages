
name: Custom Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, "review_requested"]

permissions:
  pull-requests: write  # Permiso mínimo necesario

jobs:
  code_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para el diff completo

      - name: Setup dependencies
        run: sudo apt-get install -y jq  # Para procesar JSON

      - name: Get PR Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff --unified=20 origin/${{ github.base_ref }}...HEAD > pr_diff.txt

      - name: Generate security review
        id: ollama_review
        env:
          OLLAMA_URL: ${{ secrets.OLLAMA_ENDPOINT }}
        run: |
          set -euo pipefail
      
          # 1. Verificar conexión con Ollama
          if ! curl -s "$OLLAMA_URL" >/dev/null; then
            echo "::error::❌ No se puede conectar a Ollama en $OLLAMA_URL"
            echo "suggestions=🔴 Error: Servidor AI no disponible" >> $GITHUB_ENV
            exit 0
          fi
      
          # 2. Verificar modelo instalado
          MODEL_STATUS=$(curl -s "$OLLAMA_URL/api/tags" | jq -r '.models[] | select(.name == "codellama:7b") | .digest')
          if [ -z "$MODEL_STATUS" ]; then
            echo "::error::❌ Modelo codellama:7b no instalado"
            echo "suggestions=🔴 Error: Modelo AI no configurado" >> $GITHUB_ENV
            exit 0
          fi
      
          # 3. Generar y validar diff
          SANITIZED_DIFF=$(head -c 10000 pr_diff.txt | sed -e 's/[^[:print:]]/ /g' -e 's/\\/ /g')
          if [ -z "$SANITIZED_DIFF" ]; then
            echo "::warning::Diff vacío después de sanitización"
            exit 0
          fi
      
          # 4. Construir payload
          JSON_PAYLOAD=$(jq -n \
            --arg prompt "Revisar código según OWASP y PEP8:\n\`\`\`\n$SANITIZED_DIFF\n\`\`\`\nSugerencias:" \
            '{"model":"codellama:7b", "prompt":$prompt, "stream":false}')
      
          # 5. Llamar a Ollama con logs de diagnóstico
          echo "Enviando payload:"
          echo "$JSON_PAYLOAD" | jq . > payload_debug.json
          
          RESPONSE=$(timeout 150 curl -v -s -X POST "$OLLAMA_URL/api/generate" \
            -H "Content-Type: application/json" \
            -d "@payload_debug.json") 2> curl_debug.log || CURL_ERROR=$?
          
          # 6. Analizar respuesta
          if [ -n "$CURL_ERROR" ]; then
            echo "::error::Error en curl (Código $CURL_ERROR). Logs:"
            cat curl_debug.log
            echo "suggestions=🔴 Error técnico: Ver logs del workflow" >> $GITHUB_ENV
          elif [ -z "$RESPONSE" ]; then
            echo "::error::Respuesta vacía de Ollama"
            echo "suggestions=🔴 El modelo no generó respuesta" >> $GITHUB_ENV
          else
            echo "Respuesta cruda:"
            echo "$RESPONSE" | jq .
            SUGGESTIONS=$(echo "$RESPONSE" | jq -r '.response')
            echo "suggestions=$SUGGESTIONS" >> $GITHUB_ENV
          fi

      - name: Post review comment
        if: env.suggestions != ''
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d "{\"body\":\"🔍 **Revisión Automática**\n\n${{ env.suggestions }}\"}"