name: AI Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  code_review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Generate PR Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }} --unified=0 > pr_diff.txt
          echo "Diff lines: $(wc -l pr_diff.txt)"

      - name: Debug Connection
        run: |
          curl -L -v "${{ secrets.OLLAMA_API_BASE }}/api/generate" \
            -H "Content-Type: application/json" \
            -d '{"model":"codellama:7b","prompt":"test"}'

      - name: Analyze with Ollama
        id: code_analysis
        env:
          OLLAMA_API: ${{ secrets.OLLAMA_API_BASE }}
        run: |
          # 1. Validar conexión primero
          echo "🔍 Probando conexión con Ollama..."
          if ! curl -s -f "$OLLAMA_API/api/tags"; then
            echo "::error::No se puede conectar a Ollama en $OLLAMA_API"
            exit 1
          fi
      
          # 2. Preparar payload
          DIFF_CONTENT=$(jq -Rs . pr_diff.txt)
          JSON_PAYLOAD=$(jq -n \
            --arg model "codellama:7b" \
            --arg diff "${DIFF_CONTENT:0:3000}" \
            '{
              model: $model,
              prompt: "Revisar cambios:\n\($diff)",
              stream: false,
              options: {temperature: 0.2}
            }')
      
          # 3. Enviar con seguimiento de redirecciones
          HTTP_CODE=$(curl -L -s -o response.json -w "%{http_code}" \
            -X POST "$OLLAMA_API/api/generate" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD")
      
          # 4. Manejar respuesta
          if [ "$HTTP_CODE" -eq 200 ]; then
            jq -r '.response' response.json > suggestions.md
            echo "suggestions=$(cat suggestions.md)" >> $GITHUB_ENV
          else
            echo "::error::Error $HTTP_CODE en la API"
            cat response.json
            exit 1
          fi

      - name: Post Review Comment
        if: env.suggestions != ''
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## 📝 Análisis Automático\n\n${process.env.suggestions}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });