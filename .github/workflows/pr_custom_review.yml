
name: Custom Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, "review_requested"]

permissions:
  pull-requests: write  # Permiso mínimo necesario

jobs:
  code_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para el diff completo

      - name: Setup dependencies
        run: sudo apt-get install -y jq  # Para procesar JSON

      - name: Get PR Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff --unified=20 origin/${{ github.base_ref }}...HEAD > pr_diff.txt

      - name: Test Ollama
        run: |
          echo "URL: ${{ secrets.OLLAMA_API_BASE }}"
          curl -s "${{ secrets.OLLAMA_API_BASE }}/api/tags" | jq

      - name: Generate Review
        id: ollama
        env:
          OLLAMA_API: ${{ secrets.OLLAMA_API_BASE }}
        run: |
          DIFF=$(head -100 pr_diff.txt | sed 's/\x1B\[[0-9;]*[JKmsu]//g')
          
          RESPONSE=$(curl -s -X POST "$OLLAMA_API/api/generate" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "codellama:7b-instruct",
              "prompt": "Revisa este código (3 sugerencias):\n```diff\n'"$DIFF"'\n```",
              "stream": false,
              "options": {"temperature": 0.2}
            }')

          if echo "$RESPONSE" | jq -e '.response' >/dev/null; then
            echo "suggestions=$(echo "$RESPONSE" | jq -r '.response' | sed '/^$/d')" >> $GITHUB_ENV
          else
            echo "::error::Error en Ollama: $(echo "$RESPONSE" | jq -r '.error // "Unknown error"')"
            exit 1
          fi
  
      - name: Post Comment
        if: env.suggestions != ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🤖 **Revisión Automática**\n\n${process.env.suggestions}`
            })