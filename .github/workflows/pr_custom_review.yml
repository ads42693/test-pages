
name: Custom Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, "review_requested"]

permissions:
  pull-requests: write  # Permiso mínimo necesario
  contents: write
  issues: write

jobs:
  code_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para el diff completo

      - name: Setup dependencies
        run: sudo apt-get install -y jq  # Para procesar JSON

      - name: Get PR Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff --unified=20 origin/${{ github.base_ref }}...HEAD > pr_diff.txt

      - name: Test Ollama
        run: |
          echo "URL: ${{ secrets.OLLAMA_API_BASE }}"
          curl -s "${{ secrets.OLLAMA_API_BASE }}/api/tags" | jq

      - name: Generate Review
        id: ollama
        env:
          OLLAMA_API: ${{ secrets.OLLAMA_API_BASE }}
        run: |
          # Limpiar y formatear el diff
          DIFF=$(head -n 50 pr_diff.txt | sed -e 's/\x1B\[[0-9;]*[JKmsu]//g' -e 's/"/\\"/g' -e 's/$/\\n/' | tr -d '\n')
          
          # Construir JSON
          JSON_PAYLOAD=$(jq -n \
            --arg model "codellama:7b-instruct" \
            --arg diff "$DIFF" \
            '{
              "model": $model,
              "prompt": "Generar 3 sugerencias concisas (formato lista sin markdown):\nCódigo:\n```diff\n\($diff)\n```",
              "stream": false,
              "options": {"temperature": 0.2}
            }')

          RESPONSE=$(curl -s -X POST "$OLLAMA_API/api/generate" -H "Content-Type: application/json" -d "$JSON_PAYLOAD")
          
          # Sanitizar respuesta
          SUGGESTIONS=$(echo "$RESPONSE" | jq -r '.response' | 
            sed -e 's/"/\\"/g' -e 's/\n/<br>/g' -e 's/\r//g' |
            tr -cd '\11\12\15\40-\176' | head -c 2000)

          # Formatear correctamente para GitHub
          echo "suggestions<<EOF" >> $GITHUB_ENV
          echo "$SUGGESTIONS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
  
      - name: Post Comment
        if: env.suggestions != ''
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `🤖 **Revisión Automática**\n\n${process.env.suggestions
              .replace(/<br>/g, '\n')
              .replace(/(\d+\.)/g, '\n$1')}`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });