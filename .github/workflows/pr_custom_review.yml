
name: Custom Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, "review_requested"]

permissions:
  pull-requests: write  # Permiso mínimo necesario

jobs:
  code_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para el diff completo

      - name: Setup dependencies
        run: sudo apt-get install -y jq  # Para procesar JSON

      - name: Get PR Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff --unified=20 origin/${{ github.base_ref }}...HEAD > pr_diff.txt

      - name: Test Ollama
        run: |
          echo "URL: ${{ secrets.OLLAMA_API_BASE }}"
          curl -s "${{ secrets.OLLAMA_API_BASE }}/api/tags" | jq

      - name: AI Security Review
        id: ollama_review
        env:
          OLLAMA_API_BASE: ${{ secrets.OLLAMA_API_BASE }}  # Ej: https://tudominio.ngrok-free.app
          MODEL: "codellama:7b-instruct"  # Modelo optimizado
        run: |
          set -euo pipefail
      
          # 1. Configurar parámetros críticos
          MAX_DIFF_SIZE=3000  # 3KB máximo para evitar timeout
          TIMEOUT=250  # 4 minutos + margen
      
          # 2. Obtener y sanitizar diff
          SANITIZED_DIFF=$(head -c $MAX_DIFF_SIZE pr_diff.txt | \
            LC_ALL=C sed -e 's/[^[:print:]]/ /g' -e 's/\\/ /g' -e 's/\x1B\[[0-9;]*[JKmsu]//g')
      
          # 3. Construir prompt optimizado
          PROMPT=$(cat <<-EOF
          [INSTRUCCIONES]
          1. Analizar código para vulnerabilidades OWASP Top 10
          2. Verificar formato PEP8
          3. Máximo 3 sugerencias
          4. Usar formato:
          - [TIPO] Descripción
            \`Código ejemplo\`
      
          [CÓDIGO]
          \`\`\`
          $SANITIZED_DIFF
          \`\`\`
          EOF
          )
      
          # 4. Llamada a Ollama con parámetros optimizados
          JSON_PAYLOAD=$(jq -n \
            --arg model "$MODEL" \
            --arg prompt "$PROMPT" \
            '{
              "model": $model,
              "prompt": $prompt,
              "stream": false,
              "options": {
                "num_ctx": 1024,  # Reducir contexto
                "temperature": 0.3
              }
            }')
      
          # 5. Ejecutar con timeout extendido y logs detallados
          echo "Payload enviado:"
          echo "$JSON_PAYLOAD" | jq .
      
          if ! RESPONSE=$(timeout $TIMEOUT curl -v -s -X POST "$OLLAMA_API_BASE/api/generate" \
            -H "Content-Type: application/json" \
            -d "@-" <<< "$JSON_PAYLOAD" 2> curl.log); then
      
            echo "::error::❌ Timeout excedido ($TIMEOUT segundos)"
            echo "suggestions=⏳ El análisis tardó demasiado. Considera:" >> $GITHUB_ENV
            echo "suggestions+=🔹 Reducir tamaño del PR" >> $GITHUB_ENV
            echo "suggestions+=🔹 Usar modelo más ligero" >> $GITHUB_ENV
            exit 0
          fi
      
          # 6. Procesar respuesta
          if SUGGESTIONS=$(echo "$RESPONSE" | jq -r '.response' | sed '/^$/d'); then
            echo "suggestions=$SUGGESTIONS" >> $GITHUB_ENV
          else
            echo "::error::Error procesando respuesta"
            echo "suggestions=🔴 Error técnico. Ver logs" >> $GITHUB_ENV
            cat curl.log
          fi

      - name: Post review comment
        if: env.suggestions != ''
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d "{\"body\":\"🔍 **Revisión Automática**\n\n${{ env.suggestions }}\"}"