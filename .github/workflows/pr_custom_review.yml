name: AI Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  code_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Analyze Modified Files
        id: code_analysis
        env:
          OLLAMA_API: ${{ secrets.OLLAMA_API_BASE }}
        run: |
          # 1. Encontrar todos los archivos modificados en el PR
          FILES=$(git diff --name-only --diff-filter=ACM origin/${{ github.base_ref }}..origin/${{ github.head_ref }})

          if [ -z "$FILES" ]; then
            echo "No files to check."
            exit 0
          fi

          # 2. Inicializar variable para almacenar todas las sugerencias
          ALL_SUGGESTIONS="## Archivos Revisados\n"
          for FILE in $FILES; do
            ALL_SUGGESTIONS="${ALL_SUGGESTIONS}- $FILE\n"
          done

          # 3. Revisar cada archivo modificado
          for FILE in $FILES; do
            echo "Reviewing file: $FILE"

            # Manejar archivos eliminados
            if [ ! -f "$FILE" ]; then
              echo "Skipping deleted file: $FILE"
              continue
            fi

            # Leer el contenido del archivo y escapar caracteres especiales
            content=$(cat "$FILE" | jq -Rs .)
            prompt="\nRevise este código, proporcione sugerencias de mejora, mejores prácticas de codificación, mejore la legibilidad y la capacidad de mantenimiento. Elimine cualquier olor a código o antipatrón. Proporcione ejemplos de código para su sugerencia. Responda en formato markdown. Si el archivo no tiene código o no necesita cambios, diga 'No se necesitan cambios'."

            # Crear el payload JSON
            JSON_PAYLOAD=$(jq -n \
              --arg model "codellama:7b" \
              --arg code "$content" \
              --arg prompt "$prompt" \
              '{
                model: $model,
                prompt: "Code: \($code) \($prompt)",
                stream: false,
                options: { "temperature": 0.2 }
              }')

            # Verificar si jq tuvo éxito
            if [ $? -ne 0 ]; then
              echo "Error: Failed to create JSON payload for $FILE"
              continue
            fi

            # Enviar la solicitud a la API
            response=$(curl -s -X POST "$OLLAMA_API/api/generate" \
              --http1.1 \
              -H "Content-Type: application/json" \
              -d "$JSON_PAYLOAD")

            # Extraer las sugerencias de la respuesta
            suggestions=$(echo "$response" | jq -r '.response')

            # Añadir las sugerencias al conjunto de todas las sugerencias
            ALL_SUGGESTIONS="${ALL_SUGGESTIONS}\n### 🔍 Review for $FILE\n\n\`\`\`suggestion\n$suggestions\n\`\`\`\n\n---\n"
          done

          # Exportar todas las sugerencias como una variable de entorno
          echo "suggestions<<EOF" >> $GITHUB_ENV
          echo -e "$ALL_SUGGESTIONS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Post Review Comment
        if: env.suggestions != ''
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## 📝 Análisis Automático\n\n${process.env.suggestions}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });