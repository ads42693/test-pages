name: AI Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  code_review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Ollama Connection
        run: |
          echo "Testing Ollama API at: ${{ secrets.OLLAMA_API_BASE }}/api/tags"
          curl -s "${{ secrets.OLLAMA_API_BASE }}/api/tags" | jq
        env:
          OLLAMA_API_BASE: ${{ secrets.OLLAMA_API_BASE }}

      - name: Get PR Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt

      - name: Generate Review
        id: ollama
        env:
          OLLAMA_API: ${{ secrets.OLLAMA_API_BASE }}
        run: |
          # Preparar diff (versión segura)
          DIFF_CONTENT=$(head -n 100 pr_diff.txt | sed -e 's/\x1B\[[0-9;]*[JKmsu]//g' | jq -Rs .)
          
          # Construir payload específico para codellama:7b
          JSON_PAYLOAD=$(jq -n \
            --arg model "codellama:7b" \
            --arg diff "$DIFF_CONTENT" \
            '{
              "model": $model,
              "prompt": "[INST] Genera 3 sugerencias técnicas en markdown para este PR basado en el diff:\n\($diff)\n[/INST]",
              "stream": false,
              "options": {"temperature": 0.2, "num_ctx": 2048}
            }')

          echo "Sending payload: $JSON_PAYLOAD"
          
          # Enviar solicitud con timeout
          RESPONSE=$(timeout 30 curl -s -X POST "$OLLAMA_API/api/generate" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD")
          
          echo "Raw API response: $RESPONSE"

          # Procesar respuesta
          if [ $? -eq 0 ] && echo "$RESPONSE" | jq -e '.response' >/dev/null; then
            SUGGESTIONS=$(echo "$RESPONSE" | jq -r '.response' | sed 's/"/\"/g')
            echo "suggestions<<EOF" >> $GITHUB_ENV
            echo "$SUGGESTIONS" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "::error::Failed to get valid response from Ollama"
            echo "suggestions=" >> $GITHUB_ENV
          fi

      - name: Post PR Comment
        if: env.suggestions != ''
        uses: actions/github-script@v7
        with:
          script: |
            const body = `
              ## 🤖 Revisión Automática
              
              ${process.env.suggestions}

              _Revisión generada por [Ollama](${process.env.OLLAMA_API})_ 
            `;
            
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } catch (e) {
              core.error("Error posting comment: " + e.message);
            }