name: AI Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  code_review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para obtener todo el historial

      - name: Setup environment
        run: sudo apt-get install -y jq

      - name: Get Base Branch
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git checkout ${{ github.base_ref }}

      - name: Generate PR Diff
        run: |
          git checkout ${{ github.head_ref }}
          git diff --unified=0 ${{ github.base_ref }} > pr_diff.txt
          echo "Diff generado:"
          head -n 100 pr_diff.txt

      - name: Analyze with Ollama
        id: code_analysis
        env:
          OLLAMA_API: ${{ secrets.OLLAMA_API_BASE }}
        run: |
          # Preprocesar diff y construir prompt
          DIFF_CONTENT=$(sed -e 's/\x1B\[[0-9;]*[JKmsu]//g' pr_diff.txt | jq -Rs .)
          
          PROMPT=$(jq -n \
            --arg diff "$DIFF_CONTENT" \
            '{
              "model": "codellama:7b",
              "prompt": "Como experto en code review, analiza estos cambios (formato markdown):\n1. Identifica posibles bugs\n2. Sugiere mejoras de código\n3. Recomendaciones de estilo\n\nDiff:\n\($diff)",
              "stream": false,
              "options": {"temperature": 0.1, "num_ctx": 4096}
            }')

          # Enviar a Ollama y procesar respuesta
          RESPONSE=$(curl -s -X POST "$OLLAMA_API/api/generate" \
            -H "Content-Type: application/json" \
            -d "$PROMPT")

          echo "Respuesta de la API: $RESPONSE"
          
          # Extraer y formatear sugerencias
          SUGGESTIONS=$(echo "$RESPONSE" | jq -r '.response' | 
            sed '/^$/d' | 
            head -c 4000 |  # Limitar tamaño para GitHub
            jq -Rs '.' | 
            sed 's/^"//;s/"$//')

          echo "suggestions=$SUGGESTIONS" >> $GITHUB_ENV

      - name: Post Review Comment
        if: env.suggestions != null && env.suggestions != 'null'
        uses: actions/github-script@v7
        with:
          script: |
            const analysis = process.env.suggestions 
              ? process.env.suggestions 
                  .replace(/\\n/g, '\n')
                  .replace(/\\"/g, '"')
              : 'No se generaron sugerencias';
            
            const commentBody = `
              ## 🔍 Revisión Automática de Código
              
              **Análisis de cambios en:** ${context.payload.pull_request.head.sha.slice(0,7)}
              
              ${analysis}
              
              _Revisión generada con [Codellama 7B](${process.env.OLLAMA_API})_
            `;
            
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody
              });
            } catch (error) {
              core.error(`Error al publicar comentario: ${error.message}`);
            }