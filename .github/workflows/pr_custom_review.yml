
name: Custom Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, "review_requested"]

permissions:
  pull-requests: write  # Permiso mínimo necesario

jobs:
  code_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para el diff completo

      - name: Setup dependencies
        run: sudo apt-get install -y jq  # Para procesar JSON

      - name: Get PR Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff --unified=20 origin/${{ github.base_ref }}...HEAD > pr_diff.txt

      - name: Generate security review
        id: ollama_review
        env:
          OLLAMA_URL: ${{ secrets.OLLAMA_ENDPOINT }}
        run: |
          set -euo pipefail
          
          # 1. Verificar diff
          if [ ! -f pr_diff.txt ] || [ ! -s pr_diff.txt ]; then
            echo "❌ Error: No hay diff para analizar"
            exit 0
          fi
      
          # 2. Sanitización robusta (sin iconv)
          SANITIZED_DIFF=$(head -c 15000 pr_diff.txt | \
            LC_ALL=C sed -e 's/[^[:print:]]/ /g' \
            -e 's/[áä]/a/g; s/[éë]/e/g; s/[íï]/i/g; s/[óö]/o/g; s/[úü]/u/g' \
            -e 's/[ÁÄ]/A/g; s/[ÉË]/E/g; s/[ÍÏ]/I/g; s/[ÓÖ]/O/g; s/[ÚÜ]/U/g' \
            -e 's/ñ/n/g; s/Ñ/N/g' \
            -e 's/[^a-zA-Z0-9 ¿?¡!@#%^&+=/<>,.:;_\(\)-]/ /g')
      
          # 3. Construir prompt seguro
          PROMPT=$(cat <<-EOF
          Instrucciones de revisión:
          1. Priorizar OWASP Top 10
          2. Verificar PEP8
          3. Aplicar SOLID
      
          Código:
          \`\`\`
          $SANITIZED_DIFF
          \`\`\`
      
          Formato requerido:
          - Máximo 3 sugerencias
          - Usar guiones (-)
          - Código entre backticks
          EOF
          )
      
          # 4. Llamar a Ollama con manejo de errores
          set +e  # Desactivar parada por errores
          RESPONSE=$(timeout 120 curl -s -X POST "$OLLAMA_URL/api/generate" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"codellama:7b\",\"prompt\":\"$PROMPT\",\"stream\":false}")
          set -e  # Reactivar manejo estricto
      
          # 5. Procesar respuesta
          if [ -z "$RESPONSE" ]; then
            echo "suggestions=🔴 Error: No se obtuvo respuesta del modelo" >> $GITHUB_ENV
          else
            SUGGESTIONS=$(echo "$RESPONSE" | jq -r '.response' | \
              sed 's/\x1b\[[0-9;]*m//g; s/[“”‘’]/"/g; s/\*/•/g')
            echo "suggestions=${SUGGESTIONS:0:4000}" >> $GITHUB_ENV  # Limitar a 4000 caracteres
          fi

      - name: Post review comment
        if: env.suggestions != ''
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d "{\"body\":\"🔍 **Revisión Automática**\n\n${{ env.suggestions }}\"}"