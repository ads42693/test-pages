
name: Custom Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, "review_requested"]

permissions:
  pull-requests: write  # Permiso mínimo necesario
  contents: write
  issues: write

jobs:
  code_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para el diff completo

      - name: Setup dependencies
        run: sudo apt-get install -y jq  # Para procesar JSON

      - name: Get PR Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff --unified=20 origin/${{ github.base_ref }}...HEAD > pr_diff.txt

      - name: Test Ollama
        run: |
          echo "URL: ${{ secrets.OLLAMA_API_BASE }}"
          curl -s "${{ secrets.OLLAMA_API_BASE }}/api/tags" | jq

      - name: Generate Review
        id: ollama
        env:
          OLLAMA_API: ${{ secrets.OLLAMA_API_BASE }}
        run: |
          # Limpiar y truncar diff
          DIFF=$(head -n 50 pr_diff.txt | sed -e 's/\x1B\[[0-9;]*[JKmsu]//g' -e 's/"/\\"/g' -e 's/$/\\n/' | tr -d '\n')
          
          # Construir payload
          JSON_PAYLOAD=$(jq -n \
            --arg model "codellama:7b" \
            --arg diff "$DIFF" \
            '{
              "model": $model,
              "prompt": "Revisión código (3 puntos):\n```diff\n\($diff)\n```",
              "stream": false,
              "options": {"temperature": 0.2}
            }')

          # Enviar solicitud
          RESPONSE=$(curl -s -X POST "$OLLAMA_API/api/generate" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD")

          echo "Raw response: $RESPONSE"  # Para debug
          
          # Procesar respuesta
          if echo "$RESPONSE" | jq -e '.response' >/dev/null; then
            echo "suggestions=$(echo "$RESPONSE" | jq -r '.response' | sed '/^$/d')" >> $GITHUB_ENV
          else
            echo "::error::Error en Ollama: $(echo "$RESPONSE" | jq -r '.error? // "Respuesta inválida"')"
            exit 1
          fi
  
      - name: Post Comment
        if: env.suggestions != ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🤖 **Revisión Automática**\n\n${process.env.suggestions}`
            })