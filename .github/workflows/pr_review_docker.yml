name: AI Code Review Docker

on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  code_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y jq file docker-compose
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Run Docker Compose
        run: |
          docker-compose up -d

      - name: Test API Connection
        id: test_connection
        env:
          OLLAMA_API: http://localhost:11434
          MODEL_LLM: codellama:7b
        run: |
          echo "Probando conexión a la API en $OLLAMA_API..."

          # Crear un payload básico para probar el modelo
          TEST_PAYLOAD=$(jq -n \
            --arg model "codellama:7b" \
            --arg prompt "Hola, este es un test básico del modelo." \
            '{
              model: $model,
              prompt: $prompt,
              stream: false,
              options: { "temperature": 0.2, "max_tokens": 10 }
            }')

          # Enviar la solicitud al endpoint con el payload básico
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$OLLAMA_API/api/generate" \
            -H "Content-Type: application/json" \
            -d "$TEST_PAYLOAD")

          # Validar la respuesta
          if [ "$response" -ne 200 ]; then
            echo "Error: No se pudo conectar al modelo. Código de respuesta HTTP: $response"
            exit 1
          fi

          echo "Conexión exitosa al modelo. Código de respuesta HTTP: $response"

      - name: Analyze Modified Files
        if: ${{ success() }}
        id: code_analysis
        env:
          OLLAMA_API: http://localhost:11434
          MODEL_LLM: codellama:7b
        run: |
          echo "Iniciando análisis de archivos modificados..."

          # 1. Encontrar todos los archivos modificados en el PR
          FILES=$(git diff --name-only --diff-filter=ACM origin/${{ github.base_ref }}..origin/${{ github.head_ref }})
          if [ -z "$FILES" ]; then
            echo "No hay archivos por revisar."
            exit 0
          fi

          echo "Archivos modificados encontrados: $FILES"
      
          # Inicializamos la variable suggestions con la lista de archivos
          suggestions="## Archivos Revisados\n"
          for FILE in $FILES; do
            suggestions="${suggestions}- $FILE\n"
          done

          # 2. Revisar cada archivo modificado
          for FILE in $FILES; do
            echo "Revisando archivo: $FILE"

            # Verificamos si el archivo es de texto
            if ! file "$FILE" | grep -q text; then
              echo "Archivo no procesable como texto: $FILE"
              suggestions="${suggestions}\n## Revisión para $FILE\n\nArchivo binario o no procesable como texto.\n\n-----------\n"
              continue
            fi
            
            # Obtener el prompt desde el archivo
            PROMPT_FILE=".github/prompts/code_review_prompt.txt"
            if [ -f "$PROMPT_FILE" ]; then
              prompt=$(cat "$PROMPT_FILE" | sed 's/\\/\\\\/g' | sed 's/"/\\"/g' | tr '\n' ' ')
              echo "Usando prompt desde archivo."
            fi

            # Leer el contenido del archivo de manera segura
            code_content=$(cat "$FILE" | sed 's/\\/\\\\/g' | sed 's/"/\\"/g' | tr -d '\r')
            
            # Crear el payload JSON de manera segura
            JSON_PAYLOAD=$(jq -n \
              --arg model "$MODEL_LLM" \
              --arg code "$code_content" \
              --arg prompt "$prompt" \
              '{
                model: $model,
                prompt: ("Code:\n```\n" + $code + "\n```\n" + $prompt),
                stream: false,
                options: { "temperature": 0.2, "max_tokens": 500 }
              }')
            
            # Enviar la solicitud a la API y obtener la respuesta con manejo de errores
            echo "Enviando solicitud a la API..."
            response=$(curl -s -X POST "$OLLAMA_API/api/generate" \
              -H "Content-Type: application/json" \
              -d "$JSON_PAYLOAD")
            
            # Verificar si la respuesta es válida
            if echo "$response" | jq -e '.response' > /dev/null 2>&1; then
              review_text=$(echo "$response" | jq -r '.response')
              echo "Respuesta recibida correctamente."
            else
              echo "Error al obtener respuesta de la API para: $FILE"
              echo "Respuesta recibida: $response"
              review_text="Error al analizar este archivo. Por favor, revísalo manualmente."
            fi
            
            # Acumular la revisión para este archivo en la variable suggestions
            suggestions="${suggestions}\n## Revisión para $FILE\n\n$review_text\n\n-----------\n"
          done
      
          # Exportar la variable suggestions como variable de entorno
          echo "suggestions<<EOF" >> $GITHUB_OUTPUT
          echo -e "$suggestions" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Post Review Comment
        if: ${{ steps.code_analysis.outputs.suggestions != '' }}
        env:
          suggestions: ${{ steps.code_analysis.outputs.suggestions }}
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## 📝 Análisis Automático\n\n${process.env.suggestions}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Stop Docker Compose
        if: always()
        run: |
          docker-compose down