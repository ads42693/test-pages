name: AI Code Review Docker

on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  code_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y jq file docker-compose
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Run Docker Compose for Ollama
        run: |
          docker-compose up -d --no-deps ollama
          
      - name: Download and Initialize CodeLlama Model
        run: |
          echo "Descargando e inicializando el modelo CodeLlama..."
          docker exec ollama ollama pull codellama:7b
          
      - name: Test Model
        run: |
          echo "Probando el modelo..."
          result=$(docker exec ollama ollama run codellama:7b "Hello, this is a test.")
          if [ $? -ne 0 ]; then
            echo "Error: No se pudo ejecutar el modelo"
            exit 1
          fi
          echo "Modelo probado exitosamente"

      - name: Analyze Modified Files
        id: code_analysis
        run: |
          echo "Iniciando análisis de archivos modificados..."

          # 1. Encontrar todos los archivos modificados en el PR
          FILES=$(git diff --name-only --diff-filter=ACM origin/${{ github.base_ref }}..origin/${{ github.head_ref }})
          if [ -z "$FILES" ]; then
            echo "No hay archivos por revisar."
            exit 0
          fi

          echo "Archivos modificados encontrados: $FILES"
      
          # Inicializamos la variable suggestions con la lista de archivos
          suggestions="## Archivos Revisados\n"
          for FILE in $FILES; do
            suggestions="${suggestions}- $FILE\n"
          done

          # 2. Revisar cada archivo modificado
          for FILE in $FILES; do
            echo "Revisando archivo: $FILE"

            # Verificamos si el archivo es de texto
            if ! file "$FILE" | grep -q text; then
              echo "Archivo no procesable como texto: $FILE"
              suggestions="${suggestions}\n## Revisión para $FILE\n\nArchivo binario o no procesable como texto.\n\n-----------\n"
              continue
            fi
            
            # Obtener el prompt desde el archivo
            PROMPT_FILE=".github/prompts/code_review_prompt.txt"
            if [ -f "$PROMPT_FILE" ]; then
              prompt=$(cat "$PROMPT_FILE" | sed 's/\\/\\\\/g' | sed 's/"/\\"/g' | tr '\n' ' ')
              echo "Usando prompt desde archivo."
            fi

            # Leer el contenido del archivo
            code_content=$(cat "$FILE")
            
            # Ejecutar el análisis usando el modelo
            echo "Analizando archivo con CodeLlama..."
            review_text=$(docker exec ollama ollama run codellama:7b "Code Review: $code_content\n\nPrompt: $prompt")
            
            # Acumular la revisión para este archivo
            suggestions="${suggestions}\n## Revisión para $FILE\n\n$review_text\n\n-----------\n"
          done
      
          # Exportar la variable suggestions como variable de entorno
          echo "suggestions<<EOF" >> $GITHUB_OUTPUT
          echo -e "$suggestions" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Post Review Comment
        if: ${{ steps.code_analysis.outputs.suggestions != '' }}
        env:
          suggestions: ${{ steps.code_analysis.outputs.suggestions }}
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## 📝 Análisis Automático\n\n${process.env.suggestions}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Stop Docker Compose
        if: always()
        run: |
          docker-compose down