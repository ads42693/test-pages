[config]
model_provider = "ollama"
response_format = "markdown"
# ¡Deshabilitar TODOS los fallbacks!
fallback_models = []
disable_fallback = true  # Parámetro crítico que falta

[ollama]
api_base = "http://localhost:11434"  # Usar directamente Ngrok
model = "codellama:7b"  # Versión exacta
headers = {"Content-Type": "application/json"}
temperature = 0.1
request_timeout = 600

# Bloquear OpenAI explícitamente
[openai]
enabled = false

[pr_reviewer]
enable_auto_review = true
auto_review_threshold = 500
chunk_size = 4000
# Forzar uso exclusivo de Ollama
model = "ollama/codellama"
extra_instructions = """
Eres un experto en desarrollo seguro:
- Revisa OWASP Top 10 2023
- Verifica principios SOLID
- Aplica estándares PEP8
"""