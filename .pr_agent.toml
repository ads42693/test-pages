[config]
model_provider = "ollama"
response_format = "markdown"
# ¡Deshabilitar totalmente modelos de respaldo!
fallback_models = []  # Esto es clave

[ollama]
api_base = "${OLLAMA_API_BASE}"
model = "codellama"  # Nombre exacto del modelo en Ollama (ver con `ollama list`)
headers = {"Content-Type": "application/json"}
temperature = 0.1
request_timeout = 600  # 10 minutos para modelos lentos

# Bloquear explícitamente OpenAI
[openai]
enabled = false

[pr_reviewer]
enable_auto_review = true
auto_review_threshold = 500
chunk_size = 4000
# Forzar uso exclusivo de Ollama
model = "ollama/codellama"
extra_instructions = """
Eres un experto en desarrollo seguro:
- Revisa OWASP Top 10 2023
- Verifica principios SOLID
- Aplica estándares PEP8
"""